[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "malanalyzer"
version = "0.1.0"
description = "Static malware analysis and report publishing with FastAPI, OpenCode, and Mistral"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=3,<5",
  "bleach>=6.2,<7",
  "pefile>=2024.8.26",
  "pyelftools>=0.32,<1",
  "capstone>=5.0.3,<6",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[project.scripts]
malanalyzer-worker = "malanalyzer.worker:main"

[tool.setuptools.packages.find]
include = ["malanalyzer*"]

[tool.setuptools.package-data]
malanalyzer = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sandbox: integration tests requiring the Docker analysis image (RUN_SANDBOX_TESTS=1)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
