{{- if .Values.analysis.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "malanalyzer.fullname" . }}-offline-analysis
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: analysis
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
