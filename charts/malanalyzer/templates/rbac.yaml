{{- if not .Values.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "malanalyzer.serviceAccount" . }}
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- if not .Values.analysisServiceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "malanalyzer.analysisServiceAccount" . }}
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "malanalyzer.fullname" . }}-analysis
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "malanalyzer.fullname" . }}-analysis
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "malanalyzer.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "malanalyzer.fullname" . }}-analysis
