apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "malanalyzer.fullname" . }}
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
spec:
  # SQLite/WAL and local sample storage require exactly one server pod.
  replicas: 1
  serviceName: {{ include "malanalyzer.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "malanalyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "malanalyzer.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "malanalyzer.serviceAccount" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-storage
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - "from malanalyzer.config import Settings; from malanalyzer.store import Store; s=Settings(); s.prepare(); Store(s.root).initialize()"
          envFrom:
            - configMapRef:
                name: {{ include "malanalyzer.fullname" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: api-tmp, mountPath: /tmp}
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [uvicorn, "malanalyzer.app:app", --host, "0.0.0.0", --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "malanalyzer.fullname" . }}
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.mistralApiKeyKey }}
            - name: UPLOAD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.uploadApiKeyKey }}
                  optional: true
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: api-tmp, mountPath: /tmp}
        - name: worker
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [malanalyzer-worker]
          envFrom:
            - configMapRef:
                name: {{ include "malanalyzer.fullname" . }}
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.mistralApiKeyKey }}
            - name: KUBERNETES_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: KUBERNETES_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: KUBERNETES_WORKER_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: KUBERNETES_WORKER_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: worker-tmp, mountPath: /tmp}
            - name: kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "malanalyzer.pvc" . }}
        - name: api-tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: worker-tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: kubernetes-api
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
