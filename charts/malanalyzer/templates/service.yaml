apiVersion: v1
kind: Service
metadata:
  name: {{ include "malanalyzer.fullname" . }}
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "malanalyzer.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "malanalyzer.fullname" . }}-headless
  labels:
    {{- include "malanalyzer.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "malanalyzer.selectorLabels" . | nindent 4 }}
